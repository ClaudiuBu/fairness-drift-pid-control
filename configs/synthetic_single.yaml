experiment:
  name: "synthetic_single"
  type: "single_run"
  data_type: "synthetic"
  methods:
    - base
    - static
    - sliding
    - pid
  
data:
  num_samples_per_batch: 100
  num_features: 10
  num_batches: 60
  drift_start: 15

pid_controller:
  kp: 10.0
  ki: 1.0
  kd: 0.5
  target: 0.0

output:
  dir: "results/synthetic"
  dpi: 150
  format: "png"
