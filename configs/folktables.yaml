experiment:
  name: "folktables_robustness"
  type: "robustness"  # single_run, robustness, geographic, task
  data_type: "folktables"
  
data:
  task: "income"  # income, employment
  states: ["CA", "TX", "NY", "FL", "PA", "IL", "OH", "MI", "NC", "GA"]
  years: [2014, 2015, 2016, 2017, 2018]
  mode: "temporal"  # temporal, static, geographic
  batch_size: 500
  sensitive_attribute: "SEX"
  num_time_steps: 100

methods:
  - baseline
  - pid

pid_controller:
  kp: 10.0
  ki: 1.0
  kd: 0.5
  target: 0.0

robustness:
  test_geographic: true
  test_task: false
  
output:
  dir: "results/folktables"
  dpi: 150
  format: "png"
