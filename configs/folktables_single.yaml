experiment:
  name: "folktables_single"
  type: "single_run"
  data_type: "folktables"
  
data:
  task: "income"  # income, employment
  states: ["CA"]  # Single state for quick testing
  years: [2014, 2015, 2016, 2017, 2018]
  mode: "temporal"  # temporal, static, geographic
  batch_size: 500
  sensitive_attribute: "SEX"
  num_time_steps: 100

methods:
  - baseline
  - pid

pid_controller:
  kp: 10.0
  ki: 1.0
  kd: 0.5
  target: 0.0
  
output:
  dir: "results/folktables"
  dpi: 150
  format: "png"
